# Configuración de dashboards automáticos para Grafana
# Carga automáticamente los dashboards de la carpeta /var/lib/grafana/dashboards

apiVersion: 1

providers:
  - name: 'IoT Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
