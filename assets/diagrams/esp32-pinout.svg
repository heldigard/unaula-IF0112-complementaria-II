<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de Pines ESP32 DevKit V1">
  <defs>
    <linearGradient id="grad-esp32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e40af">
    ESP32 DevKit V1 - Pinout Básico para IoT
  </text>

  <!-- ESP32 Board -->
  <g transform="translate(300, 80)">
    <!-- Main Board -->
    <rect x="0" y="0" width="400" height="540" rx="8" fill="#2d3748" filter="url(#shadow)"/>
    <rect x="20" y="100" width="360" height="340" rx="4" fill="#1a202c"/>

    <!-- Chip -->
    <rect x="140" y="180" width="120" height="120" rx="4" fill="#4a5568" stroke="#718096" stroke-width="2"/>
    <text x="200" y="235" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="white">ESP32</text>
    <text x="200" y="255" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e0">WROOM-32</text>

    <!-- Antenna -->
    <rect x="0" y="480" width="400" height="40" rx="4" fill="#4a5568"/>
    <text x="200" y="505" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e0">ANTENNA ON-BOARD</text>

    <!-- USB Port -->
    <rect x="160" y="-15" width="80" height="30" rx="4" fill="#718096" stroke="#4a5568" stroke-width="2"/>
    <text x="200" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">USB</text>

    <!-- Reset Button -->
    <circle cx="360" cy="120" r="12" fill="#e53e3e" stroke="#c53030" stroke-width="2"/>
    <text x="360" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">RST</text>

    <!-- Boot Button -->
    <circle cx="360" cy="155" r="12" fill="#3182ce" stroke="#2b6cb0" stroke-width="2"/>
    <text x="360" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">BOOT</text>

    <!-- LED -->
    <circle cx="40" cy="120" r="8" fill="#48bb78"/>
    <text x="40" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e0">LED2</text>
  </g>

  <!-- Left Pins -->
  <g transform="translate(50, 100)">
    <text x="0" y="-10" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e40af">PINES IZQUIERDA</text>

    <!-- Pin Labels -->
    <g font-family="monospace" font-size="11">
      <text x="0" y="20" fill="#dc2626">3V3</text>
      <text x="0" y="50" fill="#7c3aed">EN</text>
      <text x="0" y="80" fill="#16a34a">VP/D36</text>
      <text x="0" y="110" fill="#16a34a">VN/D39</text>
      <text x="0" y="140" fill="#d97706">D34</text>
      <text x="0" y="170" fill="#d97706">D35</text>
      <text x="0" y="200" fill="#0891b2">D32</text>
      <text x="0" y="230" fill="#0891b2">D33</text>
      <text x="0" y="260" fill="#d97706">D25</text>
      <text x="0" y="290" fill="#d97706">D26</text>
      <text x="0" y="320" fill="#d97706">D27</text>
      <text x="0" y="350" fill="#d97706">D14</text>
      <text x="0" y="380" fill="#d97706">D12</text>
      <text x="0" y="410" fill="#7c3aed">GND</text>
      <text x="0" y="440" fill="#d97706">D13</text>
      <text x="0" y="470" fill="#dc2626">D9</text>
      <text x="0" y="500" fill="#dc2626">D10</text>
      <text x="0" y="530" fill="#dc2626">D11</text>
    </g>

    <!-- Pin Visuals -->
    <g transform="translate(240, 0)">
      <rect x="0" y="10" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="40" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="70" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="100" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="130" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="160" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="190" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="220" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="250" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="280" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="310" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="340" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="370" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="400" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="430" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="460" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="490" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="520" width="10" height="20" fill="#d1d5db"/>
    </g>
  </g>

  <!-- Right Pins -->
  <g transform="translate(750, 100)">
    <text x="0" y="-10" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e40af">PINES DERECHA</text>

    <!-- Pin Visuals -->
    <g transform="translate(-10, 0)">
      <rect x="0" y="10" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="40" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="70" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="100" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="130" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="160" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="190" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="220" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="250" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="280" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="310" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="340" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="370" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="400" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="430" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="460" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="490" width="10" height="20" fill="#d1d5db"/>
      <rect x="0" y="520" width="10" height="20" fill="#d1d5db"/>
    </g>

    <!-- Pin Labels -->
    <g transform="translate(10, 0)" font-family="monospace" font-size="11">
      <text x="0" y="20" fill="#dc2626">VIN</text>
      <text x="0" y="50" fill="#7c3aed">GND</text>
      <text x="0" y="80" fill="#d97706">D13</text>
      <text x="0" y="110" fill="#d97706">D12</text>
      <text x="0" y="140" fill="#d97706">D14</text>
      <text x="0" y="170" fill="#d97706">D27</text>
      <text x="0" y="200" fill="#d97706">D26</text>
      <text x="0" y="230" fill="#d97706">D25</text>
      <text x="0" y="260" fill="#0891b2">D33</text>
      <text x="0" y="290" fill="#0891b2">D32</text>
      <text x="0" y="320" fill="#d97706">D35</text>
      <text x="0" y="350" fill="#d97706">D34</text>
      <text x="0" y="380" fill="#16a34a">VN/D39</text>
      <text x="0" y="410" fill="#16a34a">VP/D36</text>
      <text x="0" y="440" fill="#7c3aed">EN</text>
      <text x="0" y="470" fill="#7c3aed">GND</text>
      <text x="0" y="500" fill="#7c3aed">GND</text>
      <text x="0" y="530" fill="#dc2626">3V3</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 650)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">LEYENDA:</text>

    <circle cx="70" cy="-4" r="6" fill="#dc2626"/>
    <text x="85" y="0" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Power</text>

    <circle cx="150" cy="-4" r="6" fill="#7c3aed"/>
    <text x="165" y="0" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">GND/Control</text>

    <circle cx="260" cy="-4" r="6" fill="#d97706"/>
    <text x="275" y="0" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">GPIO (I/O)</text>

    <circle cx="360" cy="-4" r="6" fill="#0891b2"/>
    <text x="375" y="0" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">ADC (Touch)</text>

    <circle cx="480" cy="-4" r="6" fill="#16a34a"/>
    <text x="495" y="0" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">ADC Input Only</text>
  </g>
</svg>