<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Circuito ESP32 con sensor DHT22">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="grad-board" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1e40af">
    Circuito ESP32 + DHT22 (Sensor Temperatura/Humedad)
  </text>

  <!-- Breadboard -->
  <g transform="translate(300, 100)">
    <rect x="0" y="0" width="300" height="300" rx="8" fill="url(#grad-board)" filter="url(#shadow)"/>
    <text x="150" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#92400e" opacity="0.3">PROTOBOARD</text>

    <!-- Power Rails Top -->
    <g fill="#ef4444">
      <rect x="20" y="20" width="260" height="15" rx="3" opacity="0.8"/>
      <text x="30" y="32" font-family="monospace" font-size="11" fill="white">+</text>
    </g>
    <g fill="#3b82f6">
      <rect x="20" y="40" width="260" height="15" rx="3" opacity="0.8"/>
      <text x="30" y="52" font-family="monospace" font-size="11" fill="white">-</text>
    </g>

    <!-- Power Rails Bottom -->
    <g fill="#ef4444">
      <rect x="20" y="265" width="260" height="15" rx="3" opacity="0.8"/>
      <text x="30" y="277" font-family="monospace" font-size="11" fill="white">+</text>
    </g>
    <g fill="#3b82f6">
      <rect x="20" y="285" width="260" height="15" rx="3" opacity="0.8"/>
      <text x="30" y="297" font-family="monospace" font-size="11" fill="white">-</text>
    </g>

    <!-- Connection Points -->
    <g fill="#64748b" opacity="0.5">
      <!-- Row D for DHT22 -->
      <circle cx="80" cy="180" r="4"/>
      <circle cx="100" cy="180" r="4"/>
      <circle cx="120" cy="180" r="4"/>
      <circle cx="140" cy="180" r="4"/>
      <!-- Row F for Resistor -->
      <circle cx="180" cy="200" r="4"/>
      <circle cx="200" cy="200" r="4"/>
    </g>
  </g>

  <!-- ESP32 -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="180" height="260" rx="8" fill="#2d3748" filter="url(#shadow)"/>
    <rect x="20" y="40" width="140" height="180" rx="4" fill="#1a202c"/>

    <!-- Chip -->
    <rect x="60" y="80" width="60" height="60" rx="4" fill="#4a5568" stroke="#718096" stroke-width="2"/>
    <text x="90" y="115" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="white">ESP32</text>

    <!-- Labels -->
    <text x="90" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">ESP32</text>
    <text x="90" y="245" text-anchor="middle" font-family="monospace" font-size="10" fill="#cbd5e0">DevKit V1</text>

    <!-- Pin Labels -->
    <text x="170" y="100" text-anchor="end" font-family="monospace" font-size="10" fill="#3b82f6">3V3</text>
    <text x="170" y="130" text-anchor="end" font-family="monospace" font-size="10" fill="#ef4444">D4</text>
    <text x="170" y="160" text-anchor="end" font-family="monospace" font-size="10" fill="#10b981">GND</text>
    <text x="10" y="100" text-anchor="start" font-family="monospace" font-size="10" fill="#3b82f6">VIN</text>
    <text x="10" y="130" text-anchor="start" font-family="monospace" font-size="10" fill="#10b981">GND</text>
  </g>

  <!-- DHT22 Sensor -->
  <g transform="translate(650, 150)">
    <rect x="0" y="0" width="120" height="200" rx="8" fill="#e5e7eb" filter="url(#shadow)"/>
    <rect x="10" y="20" width="100" height="160" rx="4" fill="#374151"/>

    <!-- Sensor Grid -->
    <g fill="#6b7280" opacity="0.6">
      <circle cx="30" cy="50" r="3"/>
      <circle cx="50" cy="50" r="3"/>
      <circle cx="70" cy="50" r="3"/>
      <circle cx="90" cy="50" r="3"/>
      <circle cx="30" cy="150" r="3"/>
      <circle cx="50" cy="150" r="3"/>
      <circle cx="70" cy="150" r="3"/>
      <circle cx="90" cy="150" r="3"/>
    </g>

    <!-- Pins -->
    <g fill="#d1d5db">
      <rect x="25" y="185" width="8" height="15"/>
      <rect x="45" y="185" width="8" height="15"/>
      <rect x="65" y="185" width="8" height="15"/>
      <rect x="85" y="185" width="8" height="15"/>
    </g>

    <!-- Labels -->
    <text x="60" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e40af">DHT22</text>
    <text x="30" y="225" text-anchor="middle" font-family="monospace" font-size="9" fill="#ef4444">VCC</text>
    <text x="50" y="225" text-anchor="middle" font-family="monospace" font-size="9" fill="#3b82f6">DATA</text>
    <text x="70" y="225" text-anchor="middle" font-family="monospace" font-size="9" fill="#f59e0b">NC</text>
    <text x="90" y="225" text-anchor="middle" font-family="monospace" font-size="9" fill="#10b981">GND</text>
  </g>

  <!-- Resistor -->
  <g transform="translate(420, 310)">
    <rect x="0" y="0" width="60" height="20" rx="4" fill="#d97706" filter="url(#shadow)"/>
    <text x="30" y="-8" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#d97706">10KΩ</text>
    <text x="30" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Pull-up</text>
  </g>

  <!-- Wires -->
  <g stroke-width="3" fill="none" opacity="0.8">
    <!-- 3V3 to VCC (Red) -->
    <path d="M220 220 C260 220, 300 200, 380 200 L380 130 L650 130 L650 170" stroke="#ef4444">
      <animate attributeName="stroke-dasharray" from="0,1000" to="1000,0" dur="2s" fill="freeze"/>
    </path>

    <!-- D4 to Data (Blue) -->
    <path d="M220 250 C260 250, 280 240, 360 240 L360 260 L670 260 L670 200" stroke="#3b82f6">
      <animate attributeName="stroke-dasharray" from="0,1000" to="1000,0" dur="2s" fill="freeze"/>
    </path>

    <!-- GND to GND (Green) -->
    <path d="M220 280 C250 280, 280 300, 340 300 L340 380 L740 380 L740 200" stroke="#10b981">
      <animate attributeName="stroke-dasharray" from="0,1000" to="1000,0" dur="2s" fill="freeze"/>
    </path>

    <!-- Data to Resistor (Orange) -->
    <path d="M670 260 L670 290 L450 290 L450 310" stroke="#f59e0b">
      <animate attributeName="stroke-dasharray" from="0,1000" to="1000,0" dur="2s" fill="freeze"/>
    </path>

    <!-- Resistor to VCC (Red) -->
    <path d="M450 310 L450 130 L650 130" stroke="#ef4444" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Connection Labels -->
  <g font-family="monospace" font-size="10">
    <text x="250" y="210" fill="#ef4444">3V3 → VCC</text>
    <text x="250" y="270" fill="#3b82f6">GPIO4 → DATA</text>
    <text x="250" y="330" fill="#10b981">GND → GND</text>
  </g>

  <!-- Info Box -->
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="800" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="400" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e40af">CONEXIONES</text>
    <text x="400" y="45" text-anchor="middle" font-family="monospace" font-size="11" fill="#3b82f6">
      DHT22 VCC → 3V3 | DHT22 DATA → GPIO4 (con pull-up 10KΩ) | DHT22 GND → GND
    </text>
  </g>
</svg>