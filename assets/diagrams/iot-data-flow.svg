<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" aria-labelledby="title desc">
  <title id="title">Flujo de Datos IoT</title>
  <desc id="desc">Diagrama completo del flujo de datos desde sensores hasta dashboard en IoT</desc>

  <!-- Fondo -->
  <rect width="900" height="480" fill="#f8fafc"/>

  <!-- Título -->
  <text x="450" y="30" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Flujo de Datos en un Sistema IoT
  </text>
  <text x="450" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Del sensor físico al dashboard en la nube</text>

  <!-- Capa 1: Sensores -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="800" height="70" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="400" y="25" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">CAPA 1: SENSORES (mundo físico)</text>

    <g transform="translate(100, 35)">
      <!-- Sensor 1 -->
      <rect x="0" y="0" width="80" height="35" rx="5" fill="#ef4444" opacity="0.3"/>
      <text x="40" y="22" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">DHT22</text>
      <text x="40" y="32" font-family="system-ui, sans-serif" font-size="7" fill="#991b1b" text-anchor="middle">Temp/Hum</text>

      <!-- Sensor 2 -->
      <rect x="100" y="0" width="80" height="35" rx="5" fill="#f59e0b" opacity="0.3"/>
      <text x="140" y="22" font-family="system-ui, sans-serif" font-size="9" fill="#92400e" text-anchor="middle">LDR</text>
      <text x="140" y="32" font-family="system-ui, sans-serif" font-size="7" fill="#92400e" text-anchor="middle">Luz</text>

      <!-- Sensor 3 -->
      <rect x="200" y="0" width="80" height="35" rx="5" fill="#3b82f6" opacity="0.3"/>
      <text x="240" y="22" font-family="system-ui, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle">PIR</text>
      <text x="240" y="32" font-family="system-ui, sans-serif" font-size="7" fill="#1e40af" text-anchor="middle">Movimiento</text>

      <!-- Flecha datos -->
      <g transform="translate(350, -10)">
        <rect x="0" y="0" width="350" height="30" rx="5" fill="#1e293b"/>
        <text x="175" y="20" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">{"temp": 25.5, "hum": 60, "luz": 512}</text>
      </g>
    </g>
  </g>

  <!-- Flecha -->
  <polygon points="450,155 470,175 470,195 450,195 450,220 430,195 430,175" fill="#64748b"/>

  <!-- Capa 2: Microcontrolador -->
  <g transform="translate(50, 230)">
    <rect x="0" y="0" width="800" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="400" y="25" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">CAPA 2: MICROCONTROLADOR (procesamiento local)</text>

    <g transform="translate(200, 35)">
      <rect x="0" y="0" width="120" height="35" rx="5" fill="#f59e0b" opacity="0.3"/>
      <text x="60" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#92400e" text-anchor="middle">ESP32</text>
      <text x="60" y="32" font-family="system-ui, sans-serif" font-size="7" fill="#92400e" text-anchor="middle">Lectura ADC, WiFi</text>

      <!-- Proceso -->
      <g transform="translate(150, 0)">
        <text x="0" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#374151">→ analogRead()</text>
        <text x="0" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#374151">→ WiFi.send()</text>
      </g>

      <!-- Flecha WiFi -->
      <g transform="translate(350, -10)">
        <rect x="0" y="0" width="250" height="30" rx="5" fill="#1e293b"/>
        <text x="125" y="20" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">MQTT / HTTP → Internet</text>
      </g>
    </g>
  </g>

  <!-- Flecha -->
  <polygon points="450,305 470,325 470,345 450,345 450,370 430,345 430,325 450,305" fill="#64748b"/>

  <!-- Capa 3: Internet/Red -->
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="800" height="45" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="400" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">CAPA 3: INTERNET (transporte)</text>
  </g>

  <!-- Iconos de red -->
  <g transform="translate(150, 392)">
    <circle cx="0" cy="0" r="15" fill="#3b82f6" opacity="0.2"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="8" fill="#1e40af" text-anchor="middle">WiFi</text>
  </g>
  <g transform="translate(400, 392)">
    <circle cx="0" cy="0" r="15" fill="#3b82f6" opacity="0.2"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="8" fill="#1e40af" text-anchor="middle">Cloud</text>
  </g>
  <g transform="translate(650, 392)">
    <circle cx="0" cy="0" r="15" fill="#3b82f6" opacity="0.2"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="8" fill="#1e40af" text-anchor="middle">API</text>
  </g>

  <!-- Flecha -->
  <polygon points="450,430 470,450 470,455 450,455 450,480 430,455 430,450 450,430" fill="#64748b"/>

  <!-- Capa 4: Cloud/Dashboard -->
  <g transform="translate(50, 75)">
    <rect x="800" y="0" width="90" height="400" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="845" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">CAPA 4:</text>
    <text x="845" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">NUBE +</text>
    <text x="845" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">DASHBOARD</text>
  </g>

  <!-- Elementos Cloud -->
  <g transform="translate(770, 120)">
    <rect x="0" y="0" width="80" height="30" rx="4" fill="#10b981" opacity="0.3"/>
    <text x="40" y="20" font-family="system-ui, sans-serif" font-size="8" fill="#065f46" text-anchor="middle">ThingSpeak</text>
  </g>
  <g transform="translate(770, 160)">
    <rect x="0" y="0" width="80" height="30" rx="4" fill="#3b82f6" opacity="0.3"/>
    <text x="40" y="20" font-family="system-ui, sans-serif" font-size="8" fill="#1e40af" text-anchor="middle">Grafana</text>
  </g>
  <g transform="translate(770, 200)">
    <rect x="0" y="0" width="80" height="30" rx="4" fill="#f59e0b" opacity="0.3"/>
    <text x="40" y="20" font-family="system-ui, sans-serif" font-size="8" fill="#92400e" text-anchor="middle">HiveMQ</text>
  </g>
  <g transform="translate(770, 240)">
    <rect x="0" y="0" width="80" height="30" rx="4" fill="#ef4444" opacity="0.3"/>
    <text x="40" y="20" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b" text-anchor="middle">Alertas</text>
  </g>
  <g transform="translate(770, 280)">
    <rect x="0" y="0" width="80" height="30" rx="4" fill="#6366f1" opacity="0.3"/>
    <text x="40" y="20" font-family="system-ui, sans-serif" font-size="8" fill="#3730a3" text-anchor="middle">Base Datos</text>
  </g>

  <!-- Pantalla Dashboard -->
  <g transform="translate(765, 330)">
    <rect x="0" y="0" width="90" height="60" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="5" y="5" width="80" height="25" rx="2" fill="#065f46"/>
    <line x1="10" y1="15" x2="80" y2="15" stroke="#10b981" stroke-width="2"/>
    <line x1="10" y1="22" x2="60" y2="22" stroke="#10b981" stroke-width="2"/>
    <circle cx="75" cy="45" r="8" fill="#ef4444"/>
    <text x="75" y="49" font-family="system-ui, sans-serif" font-size="8" fill="white" text-anchor="middle">!</text>
  </g>
  <text x="810" y="410" font-family="system-ui, sans-serif" font-size="9" fill="#065f46" text-anchor="middle">Visualización</text>
  <text x="810" y="422" font-family="system-ui, sans-serif" font-size="9" fill="#065f46" text-anchor="middle">+ Alertas</text>

  <!-- Leyenda de protocolos -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="700" height="25" rx="5" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="20" y="17" font-family="system-ui, sans-serif" font-size="10" fill="#374151">
      <tspan font-weight="bold">Protocolos:</tspan>
      <tspan fill="#3b82f6"> WiFi (local)</tspan> →
      <tspan fill="#f59e0b"> MQTT/HTTP (transporte)</tspan> →
      <tspan fill="#10b981"> ThingSpeak/Grafana (cloud)</tspan>
    </text>
  </g>
</svg>
