<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" aria-labelledby="title desc">
  <title id="title">Topologías de Red IoT</title>
  <desc id="desc">Comparación de topologías de red: Estrella, Malla y Árbol para IoT</desc>

  <!-- Fondo -->
  <rect width="900" height="400" fill="#f8fafc"/>

  <!-- Título -->
  <text x="450" y="30" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Topologías de Red para IoT
  </text>

  <!-- Topología Estrella -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="280" height="340" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="40" rx="12" fill="#dbeafe"/>
    <text x="140" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">TOPOLOGÍA ESTRELLA</text>

    <!-- Nodo central -->
    <circle cx="140" cy="130" r="35" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
    <text x="140" y="135" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Gateway</text>

    <!-- Nodos periféricos -->
    <circle cx="50" cy="70" r="20" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="50" y="75" font-family="system-ui, sans-serif" font-size="9" fill="#065f46">IoT 1</text>

    <circle cx="230" cy="70" r="20" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="230" y="75" font-family="system-ui, sans-serif" font-size="9" fill="#065f46">IoT 2</text>

    <circle cx="30" cy="200" r="20" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="30" y="205" font-family="system-ui, sans-serif" font-size="9" fill="#065f46">IoT 3</text>

    <circle cx="250" cy="200" r="20" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="250" y="205" font-family="system-ui, sans-serif" font-size="9" fill="#065f46">IoT 4</text>

    <circle cx="80" cy="280" r="20" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="80" y="285" font-family="system-ui, sans-serif" font-size="9" fill="#065f46">IoT 5</text>

    <circle cx="200" cy="280" r="20" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="200" y="285" font-family="system-ui, sans-serif" font-size="9" fill="#065f46">IoT 6</text>

    <!-- Conexiones -->
    <g stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3">
      <line x1="65" y1="85" x2="115" y2="105"/>
      <line x1="215" y1="85" x2="165" y2="105"/>
      <line x1="45" y1="185" x2="115" y2="145"/>
      <line x1="235" y1="185" x2="165" y2="145"/>
      <line x1="90" y1="265" x2="120" y2="155"/>
      <line x1="190" y1="265" x2="160" y2="155"/>
    </g>

    <!-- Pros/Contras -->
    <g transform="translate(20, 300)">
      <text x="10" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#10b981">✓ Simple, bajo consumo</text>
      <text x="10" y="30" font-family="system-ui, sans-serif" font-size="10" fill="#ef4444">✗ Punto único de falla</text>
    </g>
  </g>

  <!-- Topología Malla -->
  <g transform="translate(310, 60)">
    <rect x="0" y="0" width="280" height="340" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="40" rx="12" fill="#fef3c7"/>
    <text x="140" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#92400e">TOPOLOGÍA MALLA</text>

    <!-- Nodos en malla -->
    <circle cx="90" cy="70" r="18" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="90" y="75" font-family="system-ui, sans-serif" font-size="8" fill="#065f46">A</text>

    <circle cx="190" cy="70" r="18" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="190" y="75" font-family="system-ui, sans-serif" font-size="8" fill="#065f46">B</text>

    <circle cx="50" cy="140" r="18" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="50" y="145" font-family="system-ui, sans-serif" font-size="8" fill="#065f46">C</text>

    <circle cx="140" cy="140" r="22" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
    <text x="140" y="145" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">D</text>

    <circle cx="230" cy="140" r="18" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="230" y="145" font-family="system-ui, sans-serif" font-size="8" fill="#065f46">E</text>

    <circle cx="90" cy="220" r="18" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="90" y="225" font-family="system-ui, sans-serif" font-size="8" fill="#065f46">F</text>

    <circle cx="190" cy="220" r="18" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="190" y="225" font-family="system-ui, sans-serif" font-size="8" fill="#065f46">G</text>

    <circle cx="140" cy="290" r="18" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="140" y="295" font-family="system-ui, sans-serif" font-size="8" fill="#065f46">H</text>

    <!-- Conexiones en malla -->
    <g stroke="#f59e0b" stroke-width="1.5">
      <line x1="105" y1="72" x2="178" y2="72"/>
      <line x1="60" y1="130" x2="125" y2="125"/>
      <line x1="155" y1="120" x2="218" y2="132"/>
      <line x1="245" y1="130" x2="175" y2="125"/>
      <line x1="170" y1="130" x2="115" y2="130"/>
      <line x1="62" y1="150" x2="100" y2="205"/>
      <line x1="108" y1="215" x2="122" y2="260"/>
      <line x1="178" y1="215" x2="162" y2="260"/>
      <line x1="200" y1="150" x2="178" y2="205"/>
      <line x1="240" y1="150" x2="200" y2="210"/>
    </g>

    <!-- Pros/Contras -->
    <g transform="translate(20, 300)">
      <text x="10" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#10b981">✓ Redundante, robusto</text>
      <text x="10" y="30" font-family="system-ui, sans-serif" font-size="10" fill="#ef4444">✗ Mayor consumo energía</text>
    </g>
  </g>

  <!-- Topología Árbol -->
  <g transform="translate(590, 60)">
    <rect x="0" y="0" width="280" height="340" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="40" rx="12" fill="#d1fae5"/>
    <text x="140" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#065f46">TOPOLOGÍA ÁRBOL</text>

    <!-- Raíz -->
    <circle cx="140" cy="80" r="28" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
    <text x="140" y="85" font-family="system-ui, sans-serif" font-size="9" fill="#1e40af">ROOT</text>

    <!-- Nivel 2 -->
    <circle cx="70" cy="150" r="22" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
    <text x="70" y="155" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">Nodo A</text>

    <circle cx="210" cy="150" r="22" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
    <text x="210" y="155" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">Nodo B</text>

    <!-- Conexiones -->
    <line x1="105" y1="100" x2="78" y2="125" stroke="#64748b" stroke-width="2"/>
    <line x1="175" y1="100" x2="202" y2="125" stroke="#64748b" stroke-width="2"/>

    <!-- Nivel 3 - Rama A -->
    <circle cx="35" cy="230" r="16" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="35" y="235" font-family="system-ui, sans-serif" font-size="7" fill="#065f46">1</text>

    <circle cx="105" cy="230" r="16" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="105" y="235" font-family="system-ui, sans-serif" font-size="7" fill="#065f46">2</text>

    <line x1="55" y1="175" x2="43" y2="210" stroke="#64748b" stroke-width="1.5"/>
    <line x1="85" y1="175" x2="97" y2="210" stroke="#64748b" stroke-width="1.5"/>

    <!-- Nivel 3 - Rama B -->
    <circle cx="175" cy="230" r="16" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="175" y="235" font-family="system-ui, sans-serif" font-size="7" fill="#065f46">3</text>

    <circle cx="245" cy="230" r="16" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="245" y="235" font-family="system-ui, sans-serif" font-size="7" fill="#065f46">4</text>

    <line x1="195" y1="175" x2="183" y2="210" stroke="#64748b" stroke-width="1.5"/>
    <line x1="225" y1="175" x2="237" y2="210" stroke="#64748b" stroke-width="1.5"/>

    <!-- Pros/Contras -->
    <g transform="translate(20, 300)">
      <text x="10" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#10b981">✓ Escalable, organizado</text>
      <text x="10" y="30" font-family="system-ui, sans-serif" font-size="10" fill="#ef4444">✗ Falla en rama afecta sub-ramas</text>
    </g>
  </g>

  <!-- Casos de uso -->
  <g transform="translate(30, 375)">
    <rect x="0" y="0" width="840" height="22" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="450" y="16" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#374151">
      <tspan fill="#3b82f6" font-weight="bold">Estrella:</tspan> Casas inteligentes |
      <tspan fill="#f59e0b" font-weight="bold">Malla:</tspan> Ciudades inteligentes (alta densidad) |
      <tspan fill="#10b981" font-weight="bold">Árbol:</tspan> Edificios corporativos
    </text>
  </g>
</svg>
