<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparativa HTTP vs MQTT para IoT">
  <defs>
    <linearGradient id="grad-http" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-mqtt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e40af">
    Protocolos IoT: HTTP vs MQTT
  </text>

  <!-- HTTP Section -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="420" height="400" rx="12" fill="white" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>

    <!-- Header -->
    <rect x="0" y="0" width="420" height="50" rx="12" fill="url(#grad-http)"/>
    <text x="210" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="white">HTTP/HTTPS</text>

    <!-- Diagram -->
    <g transform="translate(60, 80)">
      <!-- Client -->
      <g>
        <rect x="0" y="0" width="100" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
        <text x="50" y="25" text-anchor="middle" font-family="monospace" font-size="12" font-weight="600" fill="#1e40af">ESP32</text>
        <text x="50" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">Client</text>
      </g>

      <!-- Server -->
      <g transform="translate(220, 0)">
        <rect x="0" y="0" width="100" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
        <text x="50" y="25" text-anchor="middle" font-family="monospace" font-size="12" font-weight="600" fill="#1e40af">Cloud</text>
        <text x="50" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">Server</text>
      </g>

      <!-- Request -->
      <g transform="translate(110, 10)">
        <rect x="0" y="0" width="90" height="18" rx="4" fill="#3b82f6"/>
        <text x="45" y="13" text-anchor="middle" font-family="monospace" font-size="9" fill="white">POST /data</text>
        <path d="M0 9 L-10 9" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
      </g>

      <!-- Response -->
      <g transform="translate(110, 35)">
        <rect x="0" y="0" width="90" height="18" rx="4" fill="#60a5fa"/>
        <text x="45" y="13" text-anchor="middle" font-family="monospace" font-size="9" fill="white">200 OK</text>
        <path d="M90 9 L100 9" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue-light)"/>
      </g>
    </g>

    <!-- Characteristics -->
    <g transform="translate(20, 170)" font-family="system-ui, sans-serif" font-size="12">
      <text x="0" y="0" font-weight="700" fill="#1e40af">CARACTERÍSTICAS:</text>

      <g transform="translate(0, 25)" fill="#64748b">
        <text x="0" y="0">✅ Arquitectura simple</text>
        <text x="0" y="18">✅ Compatible con todo</text>
        <text x="0" y="36">✅ Fácil de debug</text>
        <text x="0" y="54">❌ Alto overhead</text>
        <text x="0" y="72">❌ No persistente</text>
        <text x="0" y="90">❌ Mayor consumo</text>
        <text x="0" y="108">❌ Modelo request/response</text>
      </g>

      <g transform="translate(0, 140)">
        <text x="0" y="0" font-weight="700" fill="#1e40af">USO IDEAL:</text>
        <text x="0" y="18" fill="#64748b">• APIs REST estándar</text>
        <text x="0" y="34" fill="#64748b">• Comunicación esporádica</text>
        <text x="0" y="50" fill="#64748b">• Cuando necesitas HTTPS</text>
        <text x="0" y="66" fill="#64748b">• Integración con servicios web</text>
      </g>
    </g>
  </g>

  <!-- MQTT Section -->
  <g transform="translate(530, 60)">
    <rect x="0" y="0" width="420" height="400" rx="12" fill="white" stroke="#bbf7d0" stroke-width="2" filter="url(#shadow)"/>

    <!-- Header -->
    <rect x="0" y="0" width="420" height="50" rx="12" fill="url(#grad-mqtt)"/>
    <text x="210" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="white">MQTT</text>

    <!-- Diagram -->
    <g transform="translate(60, 80)">
      <!-- Broker -->
      <g transform="translate(110, 80)">
        <rect x="0" y="0" width="100" height="80" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
        <text x="50" y="30" text-anchor="middle" font-family="monospace" font-size="12" font-weight="600" fill="#065f46">Broker</text>
        <text x="50" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#059669">Mosquitto</text>
        <text x="50" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">Server</text>
      </g>

      <!-- Publisher -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="80" height="50" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
        <text x="40" y="20" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#065f46">ESP32</text>
        <text x="40" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#059669">Publisher</text>
      </g>

      <!-- Subscriber -->
      <g transform="translate(240, 110)">
        <rect x="0" y="0" width="80" height="50" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
        <text x="40" y="20" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#065f46">App</text>
        <text x="40" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#059669">Subscriber</text>
      </g>

      <!-- Publish flow -->
      <g>
        <text x="40" y="75" text-anchor="middle" font-family="monospace" font-size="8" fill="#10b981">PUBLISH</text>
        <path d="M40 50 L40 80 L110 80" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
      </g>

      <!-- Subscribe flow -->
      <g>
        <text x="280" y="105" text-anchor="middle" font-family="monospace" font-size="8" fill="#10b981">SUBSCRIBE</text>
        <path d="M280 110 L210 110" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
      </g>

      <!-- Topic -->
      <g transform="translate(110, 170)">
        <rect x="0" y="0" width="100" height="25" rx="4" fill="#10b981"/>
        <text x="50" y="17" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="white">topic/sensor</text>
      </g>

      <!-- Subscribe flow 2 -->
      <g>
        <path d="M210 170 L240 160" stroke="#059669" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow-green-dark)"/>
      </g>
    </g>

    <!-- Characteristics -->
    <g transform="translate(20, 280)" font-family="system-ui, sans-serif" font-size="12">
      <text x="0" y="0" font-weight="700" fill="#065f46">CARACTERÍSTICAS:</text>

      <g transform="translate(0, 25)" fill="#64748b">
        <text x="0" y="0">✅ Bajo overhead</text>
        <text x="0" y="18">✅ Pub/Sub asíncrono</text>
        <text x="0" y="36">✅ QoS (0,1,2)</text>
        <text x="0" y="54">✅ Persistencia de mensajes</text>
        <text x="0" y="72">✅ Last Will Testament</text>
        <text x="0" y="90">✅ Bajo consumo</text>
        <text x="0" y="108">⚠️ Requiere Broker</text>
      </g>
    </g>
  </g>

  <!-- Comparison Table -->
  <g transform="translate(50, 470)">
    <rect x="0" y="0" width="900" height="20" rx="4" fill="#f1f5f9"/>

    <text x="450" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">
      HTTP: Simple pero pesado | MQTT: Optimizado para IoT con pub/sub asíncrono y QoS garantizado
    </text>
  </g>

  <!-- Arrow Markers -->
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-blue-light" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-green-dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
  </defs>
</svg>