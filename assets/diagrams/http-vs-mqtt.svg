<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" aria-labelledby="title desc">
  <title id="title">Comparación HTTP vs MQTT</title>
  <desc id="desc">Comparación visual de los protocolos HTTP y MQTT para IoT</desc>

  <!-- Fondo -->
  <rect width="900" height="400" fill="#f8fafc"/>

  <!-- Título -->
  <text x="450" y="30" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e40af">
    HTTP vs MQTT: ¿Cuál elegir para IoT?
  </text>

  <!-- HTTP Card -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="410" height="320" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="410" height="45" rx="12" fill="#dbeafe"/>
    <text x="205" y="30" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e40af">
      HTTP (Request-Response)
    </text>

    <!-- Diagrama HTTP -->
    <g transform="translate(30, 70)">
      <!-- Cliente -->
      <circle cx="60" cy="60" r="35" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
      <text x="60" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">CLIENTE</text>

      <!-- Flechas -->
      <line x1="100" y1="60" x2="280" y2="60" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5"/>
      <polygon points="280,60 260,55 260,65" fill="#64748b"/>
      <text x="190" y="50" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Request</text>

      <line x1="280" y1="90" x2="100" y2="90" stroke="#64748b" stroke-width="2"/>
      <polygon points="100,90 120,85 120,95" fill="#64748b"/>
      <text x="190" y="105" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Response</text>

      <!-- Servidor -->
      <circle cx="320" cy="75" r="40" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
      <text x="320" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">SERVIDOR</text>
    </g>

    <!-- Características -->
    <g transform="translate(20, 180)">
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Características:</text>

      <circle cx="25" cy="45" r="5" fill="#ef4444"/>
      <text x="40" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Overhead alto (~800 bytes headers)</text>

      <circle cx="25" cy="70" r="5" fill="#ef4444"/>
      <text x="40" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#374151">No soporta push nativo</text>

      <circle cx="25" cy="95" r="5" fill="#ef4444"/>
      <text x="40" y="100" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Consume más batería</text>

      <circle cx="25" cy="120" r="5" fill="#10b981"/>
      <text x="40" y="125" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Universal y familiar</text>

      <circle cx="25" cy="145" r="5" fill="#10b981"/>
      <text x="40" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Debugging fácil (navegador)</text>
    </g>
  </g>

  <!-- MQTT Card -->
  <g transform="translate(460, 60)">
    <rect x="0" y="0" width="410" height="320" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="410" height="45" rx="12" fill="#fef3c7"/>
    <text x="205" y="30" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#92400e">
      MQTT (Publish-Subscribe)
    </text>

    <!-- Diagrama MQTT -->
    <g transform="translate(30, 70)">
      <!-- Broker central -->
      <rect x="130" y="20" width="150" height="80" rx="8" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
      <text x="205" y="50" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">BROKER MQTT</text>
      <text x="205" y="70" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#92400e">(HiveMQ, Mosquitto)</text>

      <!-- Publicador -->
      <circle cx="50" cy="60" r="30" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
      <text x="50" y="65" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">PUBLISHER</text>
      <line x1="80" y1="60" x2="130" y2="45" stroke="#64748b" stroke-width="2"/>
      <polygon points="130,45 115,50 115,40" fill="#64748b"/>
      <text x="95" y="35" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">publish</text>

      <!-- Suscriptor 1 -->
      <circle cx="50" cy="130" r="30" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
      <text x="50" y="135" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#065f46">SUBSCRIBER</text>
      <line x1="80" y1="130" x2="130" y2="95" stroke="#64748b" stroke-width="2"/>
      <polygon points="130,95 115,100 115,90" fill="#64748b"/>
      <text x="95" y="115" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">subscribe</text>

      <!-- Suscriptor 2 -->
      <circle cx="320" cy="130" r="30" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
      <text x="320" y="135" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#065f46">SUBSCRIBER</text>
      <line x1="280" y1="130" x2="205" y2="95" stroke="#64748b" stroke-width="2"/>
      <polygon points="205,95 220,90 220,100" fill="#64748b"/>
      <text x="250" y="115" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">receive</text>
    </g>

    <!-- Características -->
    <g transform="translate(20, 200)">
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Características:</text>

      <circle cx="25" cy="45" r="5" fill="#10b981"/>
      <text x="40" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Overhead bajo (~2 bytes)</text>

      <circle cx="25" cy="70" r="5" fill="#10b981"/>
      <text x="40" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Push nativo (tiempo real)</text>

      <circle cx="25" cy="95" r="5" fill="#10b981"/>
      <text x="40" y="100" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Bajo consumo de batería</text>

      <circle cx="25" cy="120" r="5" fill="#f59e0b"/>
      <text x="40" y="125" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Broker intermedio requerido</text>

      <circle cx="25" cy="145" r="5" fill="#f59e0b"/>
      <text x="40" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Curva de aprendizaje mayor</text>
    </g>
  </g>

  <!-- Cuándo usar -->
  <g transform="translate(30, 375)">
    <rect x="0" y="0" width="840" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="420" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">CUÁNDO USAR CADA UNO:</text>
    <text x="200" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#1e40af">HTTP: APIs web existentes, debugging fácil, firmware OTA</text>
    <text x="700" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#92400e">MQTT: Dispositivos batería, tiempo real, alta escala</text>
  </g>
</svg>
