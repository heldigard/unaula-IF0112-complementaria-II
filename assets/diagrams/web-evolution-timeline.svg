<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Evolución de Web 1.0 a IoT">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="grad-web1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-web2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-web3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-iot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="400" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e40af">
    Evolución: Web 1.0 → Web 2.0 → Web 3.0 → IoT
  </text>

  <!-- Timeline -->
  <g transform="translate(50, 280)">
    <line x1="0" y1="0" x2="900" y2="0" stroke="#e2e8f0" stroke-width="4"/>

    <!-- 1991 - Web 1.0 -->
    <g transform="translate(50, 0)">
      <circle r="8" fill="#64748b"/>
      <text x="0" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">1991</text>
    </g>

    <!-- 2004 - Web 2.0 -->
    <g transform="translate(270, 0)">
      <circle r="8" fill="#3b82f6"/>
      <text x="0" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#3b82f6">2004-07</text>
    </g>

    <!-- 2015 - Web 3.0 -->
    <g transform="translate(480, 0)">
      <circle r="8" fill="#8b5cf6"/>
      <text x="0" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#8b5cf6">2015+</text>
    </g>

    <!-- 2020 - IoT -->
    <g transform="translate="700, 0)">
      <circle r="8" fill="#10b981"/>
      <text x="0" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10b981">2020+</text>
    </g>
  </g>

  <!-- Web 1.0 -->
  <g transform="translate(50, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="180" rx="12" fill="url(#grad-web1)"/>
    <text x="90" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white">WEB 1.0</text>

    <g transform="translate(20, 50)" font-family="system-ui, sans-serif" font-size="11" fill="white">
      <text x="0" y="0">• Contenido ESTÁTICO</text>
      <text x="0" y="20">• Solo lectura</text>
      <text x="0" y="40">• Páginas HTML</text>
      <text x="0" y="60">• Usuario pasivo</text>
      <text x="0" y="80">• Yahoo, AltaVista</text>
      <text x="0" y="100" fill="rgba(255,255,255,0.8)" font-size="10">"Read-only web"</text>
    </g>
  </g>

  <!-- Arrow 1 -->
  <path d="M240 170 L260 170" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-gray)"/>

  <!-- Web 2.0 -->
  <g transform="translate(270, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="180" rx="12" fill="url(#grad-web2)"/>
    <text x="90" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white">WEB 2.0</text>

    <g transform="translate(20, 50)" font-family="system-ui, sans-serif" font-size="11" fill="white">
      <text x="0" y="0">• Contenido DINÁMICO</text>
      <text x="0" y="20">• Usuario genera</text>
      <text x="0" y="40">• Redes sociales</text>
      <text x="0" y="60">• AJAX, APIs REST</text>
      <text x="0" y="80">• Facebook, YouTube</text>
      <text x="0" y="100" fill="rgba(255,255,255,0.8)" font-size="10">"Social web"</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <path d="M460 170 L480 170" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <!-- Web 3.0 -->
  <g transform="translate(490, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="180" rx="12" fill="url(#grad-web3)"/>
    <text x="90" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white">WEB 3.0</text>

    <g transform="translate(20, 50)" font-family="system-ui, sans-serif" font-size="11" fill="white">
      <text x="0" y="0">• Descentralizada</text>
      <text x="0" y="20">• Blockchain</text>
      <text x="0" y="40">• Usuario = propietario</text>
      <text x="0" y="60">• Cripto, NFT, DeFi</text>
      <text x="0" y="80">• Ethereum, IPFS</text>
      <text x="0" y="100" fill="rgba(255,255,255,0.8)" font-size="10">"Decentralized web"</text>
    </g>
  </g>

  <!-- Arrow 3 -->
  <path d="M680 170 L700 170" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- IoT -->
  <g transform="translate(710, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="180" rx="12" fill="url(#grad-iot)"/>
    <text x="90" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white">IoT</text>

    <g transform="translate(20, 50)" font-family="system-ui, sans-serif" font-size="11" fill="white">
      <text x="0" y="0">• COSAS conectadas</text>
      <text x="0" y="20">• Sensores + Actuadores</text>
      <text x="0" y="40">• M2M autónomo</text>
      <text x="0" y="60">• Edge computing</text>
      <text x="0" y="80">• 75B+ dispositivos</text>
      <text x="0" y="100" fill="rgba(255,255,255,0.8)" font-size="10">"Intelligent web"</text>
    </g>
  </g>

  <!-- Evolution Metrics -->
  <g transform="translate(50, 360)">
    <text font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e40af">MÉTRICAS DE EVOLUCIÓN:</text>

    <g transform="translate(0, 20)" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">
      <text x="0" y="0">📊 Usuarios: millones → miles de millones → 75B+ dispositivos</text>
      <text x="0" y="15">⚡ Interactividad: lectura → interacción → automatización → autonomía</text>
      <text x="0" y="30">🔗 Conectividad: dial-up → broadband → mobile → everywhere</text>
      <text x="0" y="45">🧠 Inteligencia: static → algorithmic → AI → edge AI</text>
    </g>
  </g>

  <!-- Arrow Markers -->
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
  </defs>
</svg>