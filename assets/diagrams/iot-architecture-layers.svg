<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arquitectura en 4 Capas de IoT">
  <defs>
    <linearGradient id="grad-app" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-network" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-perception" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#1e40af">
    Arquitectura IoT en 4 Capas
  </text>

  <!-- Layer 4: Application -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="800" height="100" rx="12" fill="url(#grad-app)" filter="url(#shadow)"/>
    <text x="40" y="40" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="white">CAPA 4: APLICACIÓN</text>
    <text x="40" y="70" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)">Interfaces de usuario • Dashboards • APIs • Apps móviles</text>

    <!-- App Icons -->
    <g transform="translate(550, 20)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
      <text x="30" y="40" text-anchor="middle" font-size="30">📱</text>
    </g>
    <g transform="translate(630, 20)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
      <text x="30" y="40" text-anchor="middle" font-size="30">📊</text>
    </g>
    <g transform="translate(710, 20)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
      <text x="30" y="40" text-anchor="middle" font-size="30">⚙️</text>
    </g>
  </g>

  <!-- Arrow Down -->
  <path d="M450 175 L450 195" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-main)"/>

  <!-- Layer 3: Cloud/Processing -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="800" height="100" rx="12" fill="url(#grad-cloud)" filter="url(#shadow)"/>
    <text x="40" y="40" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="white">CAPA 3: PROCESAMIENTO (CLOUD/EDGE)</text>
    <text x="40" y="70" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)">Analytics • Machine Learning • Almacenamiento • Middleware</text>

    <!-- Cloud Icons -->
    <g transform="translate(550, 20)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
      <text x="30" y="40" text-anchor="middle" font-size="30">☁️</text>
    </g>
    <g transform="translate(630, 20)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
      <text x="30" y="40" text-anchor="middle" font-size="30">🧠</text>
    </g>
    <g transform="translate(710, 20)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
      <text x="30" y="40" text-anchor="middle" font-size="30">💾</text>
    </g>
  </g>

  <!-- Arrow Down -->
  <path d="M450 305 L450 325" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-main)"/>

  <!-- Layer 2: Network -->
  <g transform="translate(50, 330)">
    <rect x="0" y="0" width="800" height="100" rx="12" fill="url(#grad-network)" filter="url(#shadow)"/>
    <text x="40" y="40" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="white">CAPA 2: RED (CONNECTIVITY)</text>
    <text x="40" y="70" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)">WiFi • Bluetooth • LoRaWAN • 5G/NB-IoT • Zigbee • Ethernet</text>

    <!-- Network Icons -->
    <g transform="translate(550, 20)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
      <text x="30" y="40" text-anchor="middle" font-size="30">📶</text>
    </g>
    <g transform="translate(630, 20)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
      <text x="30" y="40" text-anchor="middle" font-size="30">📡</text>
    </g>
    <g transform="translate(710, 20)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
      <text x="30" y="40" text-anchor="middle" font-size="30">🔗</text>
    </g>
  </g>

  <!-- Arrow Down -->
  <path d="M450 435 L450 455" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-main)"/>

  <!-- Layer 1: Perception -->
  <g transform="translate(50, 460)">
    <rect x="0" y="0" width="800" height="100" rx="12" fill="url(#grad-perception)" filter="url(#shadow)"/>
    <text x="40" y="40" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="white">CAPA 1: PERCEPCIÓN (SENSORES Y ACTUADORES)</text>
    <text x="40" y="70" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)">Sensores (DHT22, LDR, GPS) • Actuadores (Relés, Motores) • GPIO • ADC</text>

    <!-- Sensor Icons -->
    <g transform="translate(550, 20)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
      <text x="30" y="40" text-anchor="middle" font-size="30">🌡️</text>
    </g>
    <g transform="translate(630, 20)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
      <text x="30" y="40" text-anchor="middle" font-size="30">💡</text>
    </g>
    <g transform="translate(710, 20)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
      <text x="30" y="40" text-anchor="middle" font-size="30">⚡</text>
    </g>
  </g>

  <!-- Main Arrow Marker -->
  <defs>
    <marker id="arrow-main" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L12,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Side Notes -->
  <g transform="translate(50, 575)">
    <text font-family="system-ui, sans-serif" font-size="12" fill="#64748b">↑ Datos fluyen ASCENDENTE: Sensores → Red → Nube → App</text>
  </g>
</svg>