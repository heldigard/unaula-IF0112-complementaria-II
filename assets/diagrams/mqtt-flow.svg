<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" aria-labelledby="title desc">
  <title id="title">Flujo de Comunicación MQTT</title>
  <desc id="desc">Diagrama del flujo de comunicación MQTT entre Publisher, Broker y Subscriber</desc>

  <!-- Fondo -->
  <rect width="700" height="350" fill="#1e293b"/>

  <!-- Título -->
  <text x="350" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#94a3b8">
    Ejemplo de flujo de comunicación MQTT
  </text>

  <!-- Publisher (Sensor ESP32) -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="130" height="100" rx="12" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
    <rect x="15" y="15" width="100" height="70" rx="8" fill="#1e3a8a" opacity="0.5"/>

    <!-- Icono ESP32 simplificado -->
    <rect x="35" y="25" width="60" height="35" rx="4" fill="#1e40af"/>
    <circle cx="50" cy="42" r="5" fill="#60a5fa"/>
    <circle cx="80" cy="42" r="5" fill="#60a5fa"/>
    <text x="65" y="70" font-family="monospace" font-size="10" text-anchor="middle" fill="#93c5fd">ESP32</text>

    <text x="65" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#60a5fa">SENSOR</text>
    <text x="65" y="132" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#94a3b8">(Publisher)</text>
  </g>

  <!-- Flecha Publish -->
  <g transform="translate(185, 120)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="120,0 105,-5 105,5" fill="#60a5fa"/>
    <text x="60" y="-10" font-family="monospace" font-size="10" text-anchor="middle" fill="#60a5fa">PUBLISH</text>
    <text x="60" y="20" font-family="monospace" font-size="9" text-anchor="middle" fill="#64748b">casa/sala/temp</text>
  </g>

  <!-- Broker MQTT -->
  <g transform="translate(280, 60)">
    <rect x="0" y="0" width="140" height="140" rx="16" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
    <rect x="15" y="20" width="110" height="100" rx="8" fill="#92400e" opacity="0.5"/>

    <!-- Icono de servidor -->
    <rect x="35" y="35" width="70" height="20" rx="4" fill="#fbbf24"/>
    <rect x="35" y="60" width="70" height="20" rx="4" fill="#fbbf24"/>
    <rect x="35" y="85" width="70" height="20" rx="4" fill="#fbbf24"/>
    <circle cx="50" cy="45" r="3" fill="#78350f"/>
    <circle cx="50" cy="70" r="3" fill="#78350f"/>
    <circle cx="50" cy="95" r="3" fill="#78350f"/>

    <text x="70" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fbbf24">BROKER MQTT</text>
    <text x="70" y="170" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#94a3b8">(mosquitto, HiveMQ, AWS IoT)</text>
  </g>

  <!-- Texto interno del Broker -->
  <text x="350" y="135" font-family="monospace" font-size="8" text-anchor="middle" fill="#fcd34d">Recibe → Filtra → Distribuye</text>

  <!-- Flecha Subscribe -->
  <g transform="translate(425, 120)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#34d399" stroke-width="2"/>
    <polygon points="120,0 105,-5 105,5" fill="#34d399"/>
    <text x="60" y="-10" font-family="monospace" font-size="10" text-anchor="middle" fill="#34d399">FORWARD</text>
    <text x="60" y="20" font-family="monospace" font-size="9" text-anchor="middle" fill="#64748b">casa/sala/#</text>
  </g>

  <!-- Subscriber (App Móvil) -->
  <g transform="translate(520, 80)">
    <rect x="0" y="0" width="130" height="100" rx="12" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <rect x="25" y="10" width="80" height="75" rx="10" fill="#065f46" opacity="0.5" stroke="#34d399" stroke-width="2"/>

    <!-- Pantalla del móvil -->
    <rect x="32" y="20" width="66" height="50" rx="4" fill="#0d9488"/>
    <text x="65" y="40" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#5eead4">🌡️ 24.5°C</text>
    <text x="65" y="55" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle" fill="#99f6e4">Humedad: 65%</text>

    <!-- Home button -->
    <circle cx="65" cy="78" r="5" fill="#34d399"/>

    <text x="65" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34d399">APP MÓVIL</text>
    <text x="65" y="132" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#94a3b8">(Subscriber)</text>
  </g>

  <!-- Topics Box -->
  <g transform="translate(50, 230)">
    <rect x="0" y="0" width="600" height="100" rx="8" fill="#334155" stroke="#475569"/>
    <text x="300" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e2e8f0">
      Topics MQTT (Canales de Comunicación)
    </text>

    <!-- Ejemplos de topics -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="170" height="45" rx="6" fill="#1e293b"/>
      <text x="85" y="20" font-family="monospace" font-size="10" text-anchor="middle" fill="#60a5fa">casa/sala/temperatura</text>
      <text x="85" y="35" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#64748b">Topic específico</text>
    </g>

    <g transform="translate(215, 40)">
      <rect x="0" y="0" width="170" height="45" rx="6" fill="#1e293b"/>
      <text x="85" y="20" font-family="monospace" font-size="10" text-anchor="middle" fill="#fbbf24">casa/+/temperatura</text>
      <text x="85" y="35" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#64748b">Wildcard (+)</text>
    </g>

    <g transform="translate(410, 40)">
      <rect x="0" y="0" width="170" height="45" rx="6" fill="#1e293b"/>
      <text x="85" y="20" font-family="monospace" font-size="10" text-anchor="middle" fill="#34d399">casa/sala/#</text>
      <text x="85" y="35" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#64748b">Multi-level (#)</text>
    </g>
  </g>
</svg>
