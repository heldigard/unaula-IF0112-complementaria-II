name: Check HTML/MD sync

on:
  pull_request:
  push:

jobs:
  check-md-html-sync:
    name: Verificar que los .md de clases están sincronizados con HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar comprobación de sincronía MD→HTML
        run: bash scripts/check_md_html_sync.sh
